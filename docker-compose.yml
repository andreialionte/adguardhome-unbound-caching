services:
  adguard-dns:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adguard-unbound-caching
    hostname: adguard-dns
    
    # Network configuration
    networks:
      - dns_network
    
    # Port mappings (DNS and AdGuard Web UI)
    ports:
      - "53:53/tcp"           # DNS TCP
      - "53:53/udp"           # DNS UDP
      - "67:67/udp"           # DHCP (optional)
      - "68:68/udp"           # DHCP (optional)
      - "3000:3000/tcp"       # AdGuard Home Web UI
      - "3000:3000/udp"       # AdGuard Home QUIC
      - "5443:5443/tcp"       # AdGuard HTTPS (optional)
      - "5443:5443/udp"       # AdGuard QUIC (optional)
      - "853:853/tcp"         # DNS over TLS (optional)
      - "853:853/udp"         # DNS over QUIC (optional)
    
    # Volume mappings for persistent data
    volumes:
      - ./config:/config       # All configuration and data
    
    # Environment variables for Garnet tuning
    # See .env file or override here
    env_file:
      - .env
    environment:
      # Garnet Memory Configuration (passed to entrypoint.sh)
      GARNET_MEMORY_SIZE: "${GARNET_MEMORY_SIZE:-128m}"
      GARNET_INDEX_SIZE: "${GARNET_INDEX_SIZE:-16m}"
      GARNET_INDEX_MAX_SIZE: "${GARNET_INDEX_MAX_SIZE:-64m}"
      
      # Optional Security
      GARNET_PASSWORD: "${GARNET_PASSWORD:-}"
      GARNET_TLS_ENABLED: "${GARNET_TLS_ENABLED:-false}"
      
      # Optional Advanced
      GARNET_LOGLEVEL: "${GARNET_LOGLEVEL:-notice}"
      GARNET_STORAGE_TIER: "${GARNET_STORAGE_TIER:-false}"
      GARNET_CHECKPOINT_DIR: "${GARNET_CHECKPOINT_DIR:-/config/garnet/checkpoints}"
      
      # Disk Tier Limit (15 GB example)
      # Enable with: GARNET_STORAGE_TIER=true
      GARNET_SEGMENT_SIZE: "${GARNET_SEGMENT_SIZE:-1g}"
      GARNET_COMPACTION_MAX_SEGMENTS: "${GARNET_COMPACTION_MAX_SEGMENTS:-15}"
      GARNET_COMPACTION_FREQ: "${GARNET_COMPACTION_FREQ:-60}"
      GARNET_COMPACTION_TYPE: "${GARNET_COMPACTION_TYPE:-Lookup}"
GARNET_COMPACTION_FORCE_DELETE: "${GARNET_COMPACTION_FORCE_DELETE:-true}"
      
      # ========================================================================
      # UNBOUND CONFIGURATION
      # ========================================================================
      UNBOUND_INTERFACE: "${UNBOUND_INTERFACE:-0.0.0.0}"
      UNBOUND_PORT: "${UNBOUND_PORT:-5335}"
      UNBOUND_SO_RCVBUF: "${UNBOUND_SO_RCVBUF:-8m}"
      UNBOUND_SO_SNDBUF: "${UNBOUND_SO_SNDBUF:-8m}"
      UNBOUND_SO_REUSEPORT: "${UNBOUND_SO_REUSEPORT:-yes}"
      UNBOUND_TLS_CERT_BUNDLE: "${UNBOUND_TLS_CERT_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
      UNBOUND_TLS_UPSTREAM: "${UNBOUND_TLS_UPSTREAM:-yes}"
      UNBOUND_NUM_THREADS: "${UNBOUND_NUM_THREADS:-4}"
      UNBOUND_OUTGOING_RANGE: "${UNBOUND_OUTGOING_RANGE:-8192}"
      UNBOUND_NUM_QUERIES_PER_THREAD: "${UNBOUND_NUM_QUERIES_PER_THREAD:-4096}"
      UNBOUND_RRSET_CACHE_SIZE: "${UNBOUND_RRSET_CACHE_SIZE:-256m}"
      UNBOUND_MSG_CACHE_SIZE: "${UNBOUND_MSG_CACHE_SIZE:-128m}"
      UNBOUND_NEG_CACHE_SIZE: "${UNBOUND_NEG_CACHE_SIZE:-4m}"
      UNBOUND_CACHE_MIN_TTL: "${UNBOUND_CACHE_MIN_TTL:-300}"
      UNBOUND_CACHE_MAX_TTL: "${UNBOUND_CACHE_MAX_TTL:-86400}"
      UNBOUND_SERVE_EXPIRED: "${UNBOUND_SERVE_EXPIRED:-yes}"
      UNBOUND_PREFETCH: "${UNBOUND_PREFETCH:-yes}"
      UNBOUND_PREFETCH_KEY: "${UNBOUND_PREFETCH_KEY:-yes}"
      UNBOUND_INFRA_CACHE_SLABS: "${UNBOUND_INFRA_CACHE_SLABS:-4}"
      UNBOUND_KEY_CACHE_SLABS: "${UNBOUND_KEY_CACHE_SLABS:-4}"
      UNBOUND_MSG_CACHE_SLABS: "${UNBOUND_MSG_CACHE_SLABS:-4}"
      UNBOUND_RRSET_CACHE_SLABS: "${UNBOUND_RRSET_CACHE_SLABS:-4}"
      UNBOUND_DNSSEC: "${UNBOUND_DNSSEC:-yes}"
      UNBOUND_HARDEN_DNSSEC_STRIPPED: "${UNBOUND_HARDEN_DNSSEC_STRIPPED:-yes}"
      UNBOUND_HARDEN_BELOW_NXDOMAIN: "${UNBOUND_HARDEN_BELOW_NXDOMAIN:-yes}"
      UNBOUND_HARDEN_REFERRAL_PATH: "${UNBOUND_HARDEN_REFERRAL_PATH:-yes}"
      UNBOUND_HARDEN_ALGO_DOWNGRADE: "${UNBOUND_HARDEN_ALGO_DOWNGRADE:-yes}"
      UNBOUND_HARDEN_SHORT_BUFSIZE: "${UNBOUND_HARDEN_SHORT_BUFSIZE:-yes}"
      UNBOUND_HARDEN_LARGE_QUERIES: "${UNBOUND_HARDEN_LARGE_QUERIES:-yes}"
      UNBOUND_HARDEN_GLUE: "${UNBOUND_HARDEN_GLUE:-yes}"
      UNBOUND_VAL_CLEAN_ADDITIONAL: "${UNBOUND_VAL_CLEAN_ADDITIONAL:-yes}"
      UNBOUND_AGGRESSIVE_NSEC: "${UNBOUND_AGGRESSIVE_NSEC:-yes}"
      UNBOUND_TLS_UPSTREAM: "${UNBOUND_TLS_UPSTREAM:-yes}"
      UNBOUND_TLS_CERT_BUNDLE: "${UNBOUND_TLS_CERT_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
      UNBOUND_VERBOSITY: "${UNBOUND_VERBOSITY:-1}"
      UNBOUND_LOG_QUERIES: "${UNBOUND_LOG_QUERIES:-no}"
      UNBOUND_ACCESS_CONTROL: "${UNBOUND_ACCESS_CONTROL:-127.0.0.0/8 allow, 10.0.0.0/8 allow, 172.16.0.0/12 allow, 192.168.0.0/16 allow}"
      UNBOUND_MODULE_CONFIG: "${UNBOUND_MODULE_CONFIG:-validator cachedb iterator}"
      
      # Forward Zone (Upstream DNS) - configurable
      # Comma-separated list of forward addresses
      # Examples:
      #   UNBOUND_FORWARD_ADDR=76.76.2.40,76.76.10.40,2606:1a40::40,2606:1a40:1::40
      #   UNBOUND_FORWARD_ADDR=https://freedns.controld.com/x-hagezi-normal,quic://x-hagezi-normal.freedns.controld.com
      #   UNBOUND_FORWARD_ADDR=76.76.2.40@853#x-hagezi-normal.freedns.controld.com,1.1.1.1@853#one.one.one.one
      #   UNBOUND_FORWARD_ADDR=1.1.1.1,8.8.8.8,9.9.9.9
      UNBOUND_FORWARD_ADDR: "${UNBOUND_FORWARD_ADDR:-}"
      UNBOUND_FORWARD_TLS_UPSTREAM: "${UNBOUND_FORWARD_TLS_UPSTREAM:-}"
      UNBOUND_FORWARD_FIRST: "${UNBOUND_FORWARD_FIRST:-no}"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Health check - tests both DNS and Web UI
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 53 && curl -s http://127.0.0.1:3000 > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=adguard-dns"

networks:
  dns_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

