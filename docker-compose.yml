services:
  adguard-dns:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adguard-unbound-caching
    hostname: adguard-dns
    
    # Network configuration
    networks:
      - dns_network
    
    # Port mappings (DNS and AdGuard Web UI)
    ports:
      - "53:53/tcp"           # DNS TCP
      - "53:53/udp"           # DNS UDP
      - "67:67/udp"           # DHCP (optional)
      - "68:68/udp"           # DHCP (optional)
      - "3000:3000/tcp"       # AdGuard Home Web UI
      - "3000:3000/udp"       # AdGuard Home QUIC
      - "5443:5443/tcp"       # AdGuard HTTPS (optional)
      - "5443:5443/udp"       # AdGuard QUIC (optional)
      - "853:853/tcp"         # DNS over TLS (optional)
      - "853:853/udp"         # DNS over QUIC (optional)
    
    # Volume mappings for persistent data
    volumes:
      - ./config:/config       # All configuration and data
    
    # Environment variables for Garnet tuning
    # See .env file or override here
    env_file:
      - .env
    environment:
      # Garnet Memory Configuration (passed to entrypoint.sh)
      GARNET_MEMORY_SIZE: "${GARNET_MEMORY_SIZE:-128m}"
      GARNET_INDEX_SIZE: "${GARNET_INDEX_SIZE:-16m}"
      GARNET_INDEX_MAX_SIZE: "${GARNET_INDEX_MAX_SIZE:-64m}"
      
      # Optional Security
      GARNET_PASSWORD: "${GARNET_PASSWORD:-}"
      GARNET_TLS_ENABLED: "${GARNET_TLS_ENABLED:-false}"
      
      # Optional Advanced
      GARNET_LOGLEVEL: "${GARNET_LOGLEVEL:-notice}"
      GARNET_STORAGE_TIER: "${GARNET_STORAGE_TIER:-false}"
      GARNET_CHECKPOINT_DIR: "${GARNET_CHECKPOINT_DIR:-/config/garnet/checkpoints}"
    
    # Resource limits (optional - adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Health check - tests both DNS and Web UI
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 53 && curl -s http://127.0.0.1:3000 > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=adguard-dns"

networks:
  dns_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

