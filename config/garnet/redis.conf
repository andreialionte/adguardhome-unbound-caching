################################## NETWORK #####################################

# Listening address and port (TCP for redis-cli compatibility)
# Unix socket is configured via entrypoint.sh command line args
bind 127.0.0.1
port 6379
protected-mode yes
tcp-backlog 65535
timeout 0
tcp-keepalive 300

################################# GENERAL #####################################

# Managed by Docker entrypoint (set to no for foreground execution)
daemonize no
loglevel notice
databases 1
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"

################################ PERSISTENCE ##################################

# Garnet checkpointing (replaces Redis RDB)
# Checkpoint directory for Garnet's fast non-blocking checkpoints
dir /config/garnet/data

# Checkpoint settings for DNS workload (frequent small updates)
# Checkpoint every 60 seconds if changes exist
# Garnet uses incremental checkpointing by default

################################## MEMORY #####################################

# RAM Cache optimization - base log memory size
# Actual limit controlled by GARNET_MEMORY_SIZE env var via entrypoint
maxmemory 128mb

# Eviction policy for DNS cache (LRU is optimal for DNS)
maxmemory-policy allkeys-lru
maxmemory-samples 10

############################### PERFORMANCE ###################################

# Latency monitoring (disabled for DNS - we want maximum throughput)
latency-monitor-threshold 0

# Active rehashing for better memory efficiency
activerehashing yes

# Background processing frequency
hz 10
dynamic-hz yes

# Garnet-specific: Read cache for main store (improves read-heavy DNS workloads)
# read-cache-size 32mb  # Uncomment to enable read cache (preview feature)

############################### REVIVIFICATION ################################

# Enable revivification (automatic recovery and reuse of freed memory)
# This is a Garnet-specific optimization - uses power-of-2 sized bins by default
# Configuration options (commented for reference):
# --reviv: Enable with default power-of-2 bins
# --reviv-fraction: Fraction of mutable space eligible for revivification (0-1)
# --reviv-search-next-higher-bins: Search this many next-higher bins if best fit fails
# --reviv-bin-best-fit-scan-limit: Number of records to scan for best fit

# Revivification is enabled by default in Garnet 2.0+
# For DNS workloads with uniform expiration, it's highly effective

############################### INDEX SIZING ###################################

# Optional index size tuning (Garnet specific):
# Default: auto-computed based on maxmemory
# For DNS caching use case, typically:
#   - Index size: 16MB (for ~1M cache entries)
#   - Max index: 64MB (allows growth)
# These are passed via command line args in entrypoint.sh:
# --index-size <GARNET_INDEX_SIZE> --index-max-size <GARNET_INDEX_MAX_SIZE>

############################### TIERING & STORAGE ##############################

# Optional: Enable storage tier for larger-than-memory datasets
# storage-tier: no  # Change to yes to enable hybrid log + disk persistence
# logdir: /config/garnet/data  # Directory for tiered records

############################### SECURITY ######################################

# Optional: Authentication (set via GARNET_PASSWORD env var)
# requirepass your-password-here

# Optional: TLS (set via GARNET_TLS_ENABLED env var, requires cert.pfx)
# tls-port 6380
# tls-cert-file /config/garnet/cert.pfx
# tls-key-file-pass your-passphrase

############################### CLUSTER (Disabled) #############################

# Cluster mode not used in single-node DNS caching setup
# cluster-enabled no
