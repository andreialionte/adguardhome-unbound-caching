forward-zone:
    name: "."
    # ========================================================================
    # Control D (Hagezi Normal) - All protocols enabled
    # ========================================================================
    
    # DNS over HTTPS v3 (DoH3) - HTTP/3 (experimental in Unbound 1.18+)
    # Requires: unbound compiled with --enable-doh3 and nghttp3
    # forward-addr: https://freedns.controld.com/x-hagezi-normal
    
    # DNS over QUIC (DoQ) - QUIC transport
    # forward-addr: quic://x-hagezi-normal.freedns.controld.com
    
    # DNS over HTTPS (DoH) - HTTP/2 (stable)
    forward-addr: https://freedns.controld.com/x-hagezi-normal
    
    # DNS over TLS (DoT) - TLS transport (fallback)
    forward-tls-upstream: yes
    # IPv4 DoT
    forward-addr: 76.76.2.40@853#x-hagezi-normal.freedns.controld.com
    forward-addr: 76.76.10.40@853#x-hagezi-normal.freedns.controld.com
    # IPv6 DoT
    forward-addr: 2606:1a40::40@853#x-hagezi-normal.freedns.controld.com
    forward-addr: 2606:1a40:1::40@853#x-hagezi-normal.freedns.controld.com
    
    # ========================================================================
    # Other providers (commented - enable as needed)
    # ========================================================================
    
    ## Cloudflare
    # forward-addr: https://cloudflare-dns.com/dns-query
    # forward-addr: quic://cloudflare-dns.com
    # forward-tls-upstream: yes
    # forward-addr: 1.1.1.1@853#one.one.one.one
    # forward-addr: 1.0.0.1@853#one.one.one.one
    # forward-addr: 2606:4700:4700::1111@853#one.one.one.one
    # forward-addr: 2606:4700:4700::1001@853#one.one.one.one
    
    ## AdGuard
    # forward-addr: https://dns.adguard.com/dns-query
    # forward-addr: quic://dns.adguard.com
    # forward-tls-upstream: yes
    # forward-addr: 94.140.14.14@853#unfiltered.adguard-dns.com
    # forward-addr: 94.140.14.15@853#unfiltered.adguard-dns.com
    
    ## Quad9
    # forward-addr: https://dns.quad9.net/dns-query
    # forward-addr: quic://dns.quad9.net
    # forward-tls-upstream: yes
    # forward-addr: 9.9.9.9@853#dns.quad9.net
    # forward-addr: 149.112.112.112@853#dns.quad9.net
    
    ## NextDNS
    # forward-addr: https://dns.nextdns.io/xxxxx
    # forward-addr: quic://dns.nextdns.io
    # forward-tls-upstream: yes
    # forward-addr: 45.90.28.21@853#dns.nextdns.io
    # forward-addr: 45.90.30.21@853#dns.nextdns.io
    
    ## DNS4all
    # forward-addr: https://dns4all.eu/dns-query
    # forward-tls-upstream: yes
    # forward-addr: 194.0.5.3@853#dot.dns4all.eu
    # forward-addr: 194.0.5.64@853#dot64.dns4all.eu
    
    ## Control D (other profiles)
    # forward-addr: https://freedns.controld.com/x-hagezi-pro
    # forward-addr: https://freedns.controld.com/x-hagezi-security
    # forward-addr: https://freedns.controld.com/x-hagezi-family
    
    forward-first: no